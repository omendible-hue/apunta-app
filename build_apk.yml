name: 🎓 Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permite ejecutar manualmente desde la web

jobs:
  build:
    name: Compilar APK de Apunta
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🔨 Compilar APK (debug - listo para instalar)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 📱 Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: ✅ Compilación exitosa
        run: |
          echo "✅ APK compilado exitosamente!"
          ls -lh build/app/outputs/flutter-apk/
