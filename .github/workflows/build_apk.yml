name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Diagnostico plugins JSON completo
        run: |
          echo "=== .flutter-plugins ==="
          cat .flutter-plugins 2>/dev/null || echo "no existe"
          echo ""
          echo "=== .flutter-plugins-dependencies (raw) ==="
          python3 -m json.tool .flutter-plugins-dependencies 2>/dev/null || cat .flutter-plugins-dependencies
          echo ""
          echo "=== Plugins Android con pluginClass ==="
          python3 -c "
          import json
          raw = open('.flutter-plugins-dependencies').read()
          d = json.loads(raw)
          plugins = d.get('plugins', {}).get('android', [])
          print(f'Total plugins Android: {len(plugins)}')
          for p in plugins:
              nombre = p.get('name','?')
              clase = p.get('pluginClass') or p.get('class') or p.get('nativePluginClass') or 'AUSENTE'
              print(f'  {nombre} -> {clase}')
          " 2>/dev/null || echo "error en python"

      - name: Compilar APK verbose
        run: |
          flutter build apk --debug --no-tree-shake-icons --verbose 2>&1 | tee /tmp/build.log
          BUILD_CODE=${PIPESTATUS[0]}
          if [ $BUILD_CODE -ne 0 ]; then
            echo ""
            echo "=== CONTEXTO DEL ERROR ==="
            grep -n "v1\|deleted\|v2\|embedding\|Error\|FAILED\|Exception\|plugin" /tmp/build.log | tail -60
            exit $BUILD_CODE
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
