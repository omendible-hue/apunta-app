name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Parchear flutter_local_notifications v1 embedding
        run: |
          find ~/.pub-cache -path "*/flutter_local_notifications*" -name "*.java" -exec grep -l "PluginRegistry\|io.flutter.plugin.common.PluginRegistry" {} \; 2>/dev/null | while read f; do
            echo "Parcheando $f"
            sed -i 's/implements PluginRegistry.Registrar/\/\/ implements PluginRegistry.Registrar/g' "$f" || true
            sed -i '/PluginRegistry\.Registrar/d' "$f" || true
          done

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
