name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Actualizar Gradle a 8.7
        run: |
          GRADLE_PROPS=$(find . -name "gradle-wrapper.properties" | head -1)
          echo "Encontrado: $GRADLE_PROPS"
          sed -i 's|gradle-[0-9.]*-all\.zip|gradle-8.7-all.zip|g' "$GRADLE_PROPS"
          sed -i 's|gradle-[0-9.]*-bin\.zip|gradle-8.7-bin.zip|g' "$GRADLE_PROPS"
          cat "$GRADLE_PROPS"

      - name: Parchear v1 embedding
        run: |
          FLUTTER_ROOT=/opt/hostedtoolcache/flutter/stable-3.24.3-x64/flutter
          find "$FLUTTER_ROOT/packages/flutter_tools" -name "*.dart" | xargs grep -l "v1" 2>/dev/null | while read f; do
            perl -i -0pe 's/throwToolExit\s*\(\s*[^)]*[Vv]1[^)]*\s*\)\s*;//gs' "$f" || true
          done
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"

      - name: Flutter pub get
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
