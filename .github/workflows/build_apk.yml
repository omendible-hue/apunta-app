name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Detectar directorio del proyecto
        run: |
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.pub-cache/*" | head -1)
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Preparar local.properties
        run: |
          mkdir -p "$PROJECT_DIR/android"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/android/local.properties"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
