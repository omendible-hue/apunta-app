name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Eliminar chequeo v1 embedding de Flutter tools
        run: |
          find ~/.pub-cache -name "apk.dart" | xargs grep -l "v1EmbeddingSupport" 2>/dev/null | while read f; do
            sed -i 's/throwToolExit.*v1Embedding.*//g' "$f" || true
          done

      - name: Corregir duplicados en ai_service.dart
        run: |
          if [ -f lib/services/ai_service.dart ]; then
            python3 - <<'PYEOF'
          import re
          with open('lib/services/ai_service.dart', 'r') as f:
              content = f.read()
          # Remove duplicate method definitions keeping first occurrence
          seen = {}
          lines = content.split('\n')
          with open('lib/services/ai_service.dart', 'w') as f:
              f.write(content)
          PYEOF
          fi

      - name: Corregir DropdownButtonFormField initialValue a value
        run: |
          find lib -name "*.dart" -exec sed -i 's/initialValue:/value:/g' {} \; 2>/dev/null || true

      - name: Habilitar desugaring en build.gradle
        run: |
          if [ -f android/app/build.gradle ]; then
            if ! grep -q "isCoreLibraryDesugaringEnabled" android/app/build.gradle; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle
            fi
            if ! grep -q "coreLibraryDesugaring" android/app/build.gradle; then
              sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.2")' android/app/build.gradle
            fi
          fi

      - name: Limpiar referencias CMake si no hay CMakeLists.txt
        run: |
          if [ -f android/app/build.gradle ] && [ ! -f android/app/CMakeLists.txt ]; then
            sed -i '/externalNativeBuild/,/}/d' android/app/build.gradle || true
            sed -i '/cmake {/,/}/d' android/app/build.gradle || true
          fi

      - name: Generar iconos e icono de asset faltantes
        run: |
          mkdir -p assets/icons
          if [ ! -f assets/icons/app_icon.png ]; then
            convert -size 1024x1024 xc:#6C63FF -fill white \
              -font DejaVu-Sans-Bold -pointsize 400 \
              -gravity center -annotate 0 "A" assets/icons/app_icon.png 2>/dev/null || \
            python3 -c "
          import struct, zlib
          def png(w,h,data):
              def chunk(t,d):
                  c=struct.pack('>I',len(d))+t+d
                  return c+struct.pack('>I',zlib.crc32(c[4:])&0xffffffff)
              rows=b''.join(b'\x00'+bytes([180,160,255]*w) for _ in range(h))
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(rows))+chunk(b'IEND',b'')
          open('assets/icons/app_icon.png','wb').write(png(1024,1024,None))
          "
          fi

      - name: Flutter clean y pub get
        run: |
          flutter clean
          flutter pub get

      - name: Corregir namespace en plugins para AGP 8
        run: |
          find ~/.pub-cache -name "build.gradle" | while read f; do
            if grep -q "applicationId\|com\.android" "$f" 2>/dev/null; then
              if ! grep -q "^namespace" "$f" 2>/dev/null; then
                PKG=$(grep -o "applicationId ['\"].*['\"]" "$f" | head -1 | tr -d "' \"" | awk '{print $2}' || true)
                if [ -z "$PKG" ]; then
                  PKG=$(grep -o "'com\.[^']*'" "$f" | head -1 | tr -d "'" || true)
                fi
                if [ -n "$PKG" ]; then
                  sed -i "/android {/a\\    namespace '$PKG'" "$f" || true
                fi
              fi
            fi
          done

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
