name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Parchear v1 embedding y borrar snapshot
        run: |
          FLUTTER_ROOT=/opt/hostedtoolcache/flutter/stable-3.24.3-x64/flutter
          find "$FLUTTER_ROOT/packages/flutter_tools" -name "*.dart" \
            -exec grep -l "deleted Android v1\|v1EmbeddingSupport\|v1 embedding" {} \; \
            2>/dev/null | while read f; do
              echo "Parcheando: $f"
              sed -i '/throwToolExit.*[Vv]1.*[Ee]mbedding/d' "$f" || true
              sed -i 's/Build failed due to use of deleted Android v1 embedding/Skipping v1 check/g' "$f" || true
          done
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"
          echo "Snapshot borrado — Flutter recompilará desde fuente parcheada"

      - name: Flutter pub get
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
