name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Diagnostico completo
        run: |
          echo "=== .flutter-plugins ==="
          cat .flutter-plugins 2>/dev/null || echo "no existe"
          echo "=== Plugins Android registrados ==="
          python3 -c "
          import json,sys
          d=json.load(open('.flutter-plugins-dependencies'))
          for p in d.get('plugins',{}).get('android',[]):
              print(p['name'], '->', p.get('class','?'))
          " 2>/dev/null || echo "error parseando"
          echo "=== Check v1 en Flutter Gradle plugin ==="
          grep -rn "v1\|deleted\|Registrar\|registerWith" $FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/FlutterPlugin.groovy 2>/dev/null | grep -i "v1\|deleted" | head -20 || echo "archivo no encontrado o sin matches"

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
