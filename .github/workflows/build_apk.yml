name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Migrar a v2 embedding
        run: |
          find . -name "AndroidManifest.xml" | xargs sed -i '/flutterEmbedding/d' 2>/dev/null || true
          MAIN=$(find . -name "MainActivity.kt" | head -1)
          if [ -n "$MAIN" ]; then
            PKG=$(grep "^package" "$MAIN" | head -1 | awk '{print $2}' | tr -d ';')
            printf "package %s\nimport io.flutter.embedding.android.FlutterActivity\nclass MainActivity: FlutterActivity()\n" "$PKG" > "$MAIN"
          fi
          MAIN=$(find . -name "MainActivity.java" | head -1)
          if [ -n "$MAIN" ]; then
            PKG=$(grep "^package" "$MAIN" | head -1 | awk '{print $2}' | tr -d ';')
            printf "package %s;\nimport io.flutter.embedding.android.FlutterActivity;\npublic class MainActivity extends FlutterActivity {}\n" "$PKG" > "$MAIN"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
