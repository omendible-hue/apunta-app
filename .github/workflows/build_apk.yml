name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Limpiar archivos generados del ZIP
        run: |
          echo "=== Eliminando GeneratedPluginRegistrant si existe en el ZIP ==="
          find . -name "GeneratedPluginRegistrant*" -not -path "./.git/*" | while read f; do
            echo "Eliminando: $f"
            rm "$f"
          done
          echo "=== Sobreescribiendo local.properties con ruta correcta de CI ==="
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Flutter clean
        run: flutter clean

      - name: Instalar dependencias
        run: flutter pub get

      - name: Diagnostico plugins
        run: |
          echo "=== supportsEmbeddingV2 por plugin ==="
          python3 -c "
          import json
          d = json.load(open('.flutter-plugins-dependencies'))
          plugins = d.get('plugins', {}).get('android', [])
          print(f'Total plugins Android: {len(plugins)}')
          problemas = []
          for p in plugins:
              nombre = p.get('name','?')
              clase = p.get('pluginClass') or p.get('class') or '???'
              v2 = p.get('supportsEmbeddingV2', 'campo-ausente')
              estado = 'OK' if v2 == True else 'PROBLEMA'
              if v2 != True:
                  problemas.append(nombre)
              print(f'  [{estado}] {nombre} -> {clase}  (v2={v2})')
          if problemas:
              print(f'PLUGINS CON PROBLEMA: {problemas}')
          else:
              print(f'Todos los plugins soportan v2.')
          "

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
