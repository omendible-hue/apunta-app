name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Diagnostico v1 embedding
        run: |
          echo "=== Plugins con PluginRegistry.Registrar (v1) ==="
          find ~/.pub-cache -name "*.java" -exec grep -l "PluginRegistry.Registrar" {} \; 2>/dev/null || true
          find ~/.pub-cache -name "*.kt" -exec grep -l "PluginRegistry.Registrar" {} \; 2>/dev/null || true
          echo "=== Fin diagnostico ==="

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons --verbose 2>&1 | grep -E "v1 embedding|Registrar|plugin|ERROR|error" || flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
