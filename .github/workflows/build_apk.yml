name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Preparar local.properties y Gradle 8.7
        run: |
          mkdir -p android/gradle/wrapper
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Bajar flutter_local_notifications a v16
        run: |
          sed -i 's/flutter_local_notifications:.*$/flutter_local_notifications: ^16.3.3/' pubspec.yaml
          grep flutter_local_notifications pubspec.yaml

      - name: Parchear v1 embedding
        run: |
          FLUTTER_ROOT=/opt/hostedtoolcache/flutter/stable-3.24.3-x64/flutter
          find "$FLUTTER_ROOT/packages/flutter_tools" -name "*.dart" | xargs grep -l "v1" 2>/dev/null | while read f; do
            perl -i -0pe 's/throwToolExit\s*\(\s*[^)]*[Vv]1[^)]*\s*\)\s*;//gs' "$f" || true
          done
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"

      - name: Flutter pub get
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
