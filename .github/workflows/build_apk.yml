name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Eliminar chequeo v1 embedding de Flutter tools
        run: |
          DART_FILE=$(find /opt/hostedtoolcache -name "project.dart" -path "*/flutter_tools/lib/src/*" 2>/dev/null | head -1)
          echo "Archivo encontrado: $DART_FILE"
          sed -i "/throwToolExit.*deleted Android v1 embedding/d" "$DART_FILE"
          find /opt/hostedtoolcache -name "flutter_tools.snapshot" -delete 2>/dev/null || true
          find /opt/hostedtoolcache -name "flutter_tools.stamp" -delete 2>/dev/null || true
          echo "Patch aplicado"

      - name: Corregir duplicados en ai_service.dart
        run: |
          python3 -c "
          with open('lib/services/ai_service.dart', 'r') as f:
              lines = f.readlines()
          count = 0
          cut = len(lines)
          for i, line in enumerate(lines):
              if 'class AIService' in line and '{' in line:
                  count += 1
                  if count == 2:
                      cut = i
                      break
          print(f'Total lineas: {len(lines)}, cortando en linea: {cut}')
          with open('lib/services/ai_service.dart', 'w') as f:
              f.writelines(lines[:cut])
          print('Archivo corregido')
          "

      - name: Flutter clean y pub get
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
