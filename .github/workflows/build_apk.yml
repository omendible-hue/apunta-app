name: Compilar APK Apunta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

      - name: Preparar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Eliminar chequeo v1 embedding de Flutter tools
        run: |
          DART_FILE=$(find /opt/hostedtoolcache -name "project.dart" -path "*/flutter_tools/lib/src/*" 2>/dev/null | head -1)
          sed -i "/throwToolExit.*deleted Android v1 embedding/d" "$DART_FILE"
          find /opt/hostedtoolcache -name "flutter_tools.snapshot" -delete 2>/dev/null || true
          find /opt/hostedtoolcache -name "flutter_tools.stamp" -delete 2>/dev/null || true
          echo "Patch v1 aplicado"

      - name: Corregir duplicados en ai_service.dart
        run: |
          python3 -c "
          with open('lib/services/ai_service.dart', 'r') as f:
              lines = f.readlines()
          count = 0
          cut = len(lines)
          for i, line in enumerate(lines):
              if 'class AIService' in line and '{' in line:
                  count += 1
                  if count == 2:
                      cut = i
                      break
          print(f'Cortando ai_service.dart en linea {cut} de {len(lines)}')
          with open('lib/services/ai_service.dart', 'w') as f:
              f.writelines(lines[:cut])
          "

      - name: Corregir DropdownButtonFormField initialValue a value
        run: |
          python3 -c "
          import os
          for root, dirs, files in os.walk('lib'):
              for fname in files:
                  if not fname.endswith('.dart'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  if 'DropdownButtonFormField' not in content:
                      continue
                  lines = content.split('\n')
                  result = []
                  in_dropdown = False
                  depth = 0
                  changed = False
                  for line in lines:
                      if 'DropdownButtonFormField' in line:
                          in_dropdown = True
                          depth = line.count('(') - line.count(')')
                      elif in_dropdown:
                          depth += line.count('(') - line.count(')')
                          if depth <= 0:
                              in_dropdown = False
                      if in_dropdown and 'initialValue:' in line:
                          line = line.replace('initialValue:', 'value:')
                          changed = True
                      result.append(line)
                  if changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write('\n'.join(result))
                      print(f'Corregido: {path}')
          "

      - name: Flutter clean y pub get
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Apunta-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
